[project]
name = "sukuna-pro"
version = "0.1.0"
description = "Midsphere Agent - AI agent platform providing MCP (Model Context Protocol) servers/tools"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Midsphere" }]
keywords = ["mcp", "ai", "agent", "fastmcp", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # exo (sourced from GitHub — see [tool.uv.sources] below)
    "exo-cli",
    "exo-core",
    "exo-harness",
    "exo-mcp",
    "exo-mcp-cli",
    "exo-models",
    "exo-memory",
    "exo-context",
    "exo-guardrail",
    # agent_server runtime
    "django>=5.1",
    "django-ninja>=1.3",
    "django-storages[s3]>=1.14",
    "psycopg[binary]>=3.1",
    "uvicorn>=0.30.0",
    "asyncpg>=0.29.0",
    "PyJWT>=2.8",
    "anthropic>=0.60.0",
    "datasets<4.0.0",
    "e2b-code-interpreter>=1.2.1",
    "filetype>=1.2.0",
    "fire>=0.7.0",
    "gitpython",
    "hydra-core>=1.3.2",
    "igittigitt",
    "json5>=0.12.0",
    "markitdown-mcp>=0.0.1a3",
    "mcp>=1.12.2",
    "mutagen>=1.47.0",
    "openai>=1.78.1",
    "opencv-python",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pillow",
    "playwright",
    "psutil",
    "PyPDF2",
    "python-dotenv>=1.1.1",
    "python-json-logger>=3.3.0",
    "python-pptx",
    "pyzmq",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "rich>=14.1.0",
    "structlog",
    "tenacity>=8.2.3,<9.0.0",
    "tiktoken>=0.9.0",
    "wikipedia>=1.4.0",
    "yt-dlp==2025.12.8",
    "e2b-desktop>=2.3.0",
    "django-cors-headers>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
exo-cli = { git = "https://github.com/midsphere-ai/exo.git", rev = "9eb86474", subdirectory = "packages/exo-cli" }
exo-core = { git = "https://github.com/midsphere-ai/exo.git", rev = "9eb86474", subdirectory = "packages/exo-core" }
exo-harness = { git = "https://github.com/midsphere-ai/exo.git", rev = "9eb86474", subdirectory = "packages/exo-harness" }
exo-mcp = { git = "https://github.com/midsphere-ai/exo.git", rev = "9eb86474", subdirectory = "packages/exo-mcp" }
exo-mcp-cli = { git = "https://github.com/midsphere-ai/exo.git", rev = "9eb86474", subdirectory = "packages/exo-mcp-cli" }
exo-models = { git = "https://github.com/midsphere-ai/exo.git", rev = "9eb86474", subdirectory = "packages/exo-models" }
exo-memory = { git = "https://github.com/midsphere-ai/exo.git", rev = "9eb86474", subdirectory = "packages/exo-memory" }
exo-context = { git = "https://github.com/midsphere-ai/exo.git", rev = "9eb86474", subdirectory = "packages/exo-context" }
exo-guardrail = { git = "https://github.com/midsphere-ai/exo.git", rev = "9eb86474", subdirectory = "packages/exo-guardrail" }

[tool.hatch.build.targets.wheel]
packages = ["tools", "agent_server"]

[tool.hatch.build.targets.sdist]
include = [
    "tools/",
    "agent_server/",
    "e2b/requirements.txt",
    "README.md",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyarmor>=9.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".cache",
    "templates",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B904",   # raise without from inside except
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["tools", "agent_server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (may require API keys)",
    "unit: marks tests as unit tests (no external dependencies)",
]
addopts = "-v --strict-markers --tb=short"

[tool.coverage.run]
source = ["tools", "agent_server"]
omit = ["tests/*", "*.pyc", "__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
