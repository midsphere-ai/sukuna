[project]
name = "sukuna"
version = "1.0.0"
description = "Midsphere's complete backend with billing and stuff"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi==25.1.0",
    "setuptools>=80.9.0",
    "celery==5.5.3",
    "google-auth==2.45.0",
    "circuitbreaker==2.1.3",
    "collectfasta==3.3.0",
    "composio==0.11.0",
    "coverage==7.10.2",
    "crispy-bootstrap5==2025.6",
    "dj-rest-auth==7.0.1",
    "django==5.1.11",
    "django-allauth[mfa,socialaccount]==65.10.0",
    "django-anymail[mailgun]==13.0.1",
    "django-celery-beat==2.8.1",
    "django-coverage-plugin==3.1.1",
    "django-crispy-forms==2.4",
    "django-debug-toolbar==6.0.0",
    "django-cors-headers>=4.6.0",
    "django-environ==0.12.0",
    "django-extensions==4.1",
    "django-model-utils==5.0.0",
    "django-ninja==1.4.3",
    "django-redis==6.0.0",
    "django-storages[s3]==1.14.6",
    "django-stubs[compatible-mypy]==5.2.2",
    "django-unfold>=0.75.0",
    "djangorestframework==3.16.1",
    "djlint==1.36.4",
    "e2b-desktop>=2.3.0",
    "factory-boy==3.3.2",
    "flower==2.0.1",
    "gunicorn==23.0.0",
    "hiredis==3.2.1",
    "httpx>=0.27.0",
    "ipdb==0.13.13",
    "mypy==1.17.1",

    "pillow==11.3.0",
    "pre-commit==4.2.0",
    "psycopg==3.2.9",
    "psycopg2-binary",
    "pytest==8.4.1",
    "pytest-asyncio==0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-django==4.11.1",
    "pytest-sugar==1.0.0",
    "python-slugify==8.0.4",
    "dodopayments",
    "standardwebhooks",
    "redis==6.3.0",
    "rich",
    "ruff==0.12.7",
    "python-telegram-bot>=21.0",
    "sentry-sdk==2.34.1",
    "sphinx==8.2.3",
    "sphinx-autobuild==2024.10.3",
    "uvicorn-worker==0.3.0",
    "uvicorn[standard]==0.35.0",
    "watchfiles==1.1.0",
    "werkzeug[watchdog]==3.1.3",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "safety>=3.0.0",
]

[tool.pytest.ini_options]
# Use local settings for integration tests (real DB, real services)
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
# Use -p no:django to disable test database creation
addopts = "-v --tb=short -s"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning:asyncio",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/.venv/*",
    "manage.py",
    "config/settings/*",
    "config/wsgi.py",
    "config/asgi.py",
]
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["migrations"]
