<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0B0B0C" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Jatayu" />
		<script>
			// Blocking script: resolve theme before first paint to avoid flash.
			// Dark is the default; `data-theme` is set explicitly either way so
			// component selectors like [data-theme='dark'] still match.
			(function () {
				const stored = localStorage.getItem('midsphere-theme');
				const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches
					? 'dark'
					: 'light';
				const resolved = !stored || stored === 'system' ? preferred : stored;
				document.documentElement.setAttribute('data-theme', resolved === 'light' ? 'light' : 'dark');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
