volumes:
  sukuna_local_postgres_data: {}
  sukuna_local_postgres_data_backups: {}
  sukuna_local_redis_data: {}

services:
  django: &django
    build:
      context: ..
      dockerfile: ./infra/compose/local/django/Dockerfile
    image: sukuna_local_django
    container_name: sukuna_local_django
    depends_on:
      - postgres
      - redis
    volumes:
      - ../packages/backend:/app:z
    env_file:
      - ../packages/backend/.env
    ports:
      - '8000:8000'
    command: uv run python manage.py runserver 0.0.0.0:8000

  postgres:
    build:
      context: ..
      dockerfile: ./infra/compose/production/postgres/Dockerfile
    image: sukuna_production_postgres
    container_name: sukuna_local_postgres
    volumes:
      - sukuna_local_postgres_data:/var/lib/postgresql/data
      - sukuna_local_postgres_data_backups:/backups
    env_file:
      - ../packages/backend/.env

  redis:
    image: docker.io/redis:7-alpine
    container_name: sukuna_local_redis
    volumes:
      - sukuna_local_redis_data:/data

  web:
    build:
      context: ..
      dockerfile: ./infra/compose/local/frontend/Dockerfile
    image: sukuna_local_web
    container_name: sukuna_local_web
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ORIGIN=http://localhost

  nginx:
    image: nginx:alpine
    container_name: sukuna_local_nginx
    depends_on:
      - django
      - web
    ports:
      - '80:80'
    volumes:
      - ./compose/local/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  celeryworker:
    <<: *django
    image: sukuna_local_celeryworker
    container_name: sukuna_local_celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: uv run celery -A config.celery_app worker -l info

  celerybeat:
    <<: *django
    image: sukuna_local_celerybeat
    container_name: sukuna_local_celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: uv run celery -A config.celery_app beat -l info

  flower:
    <<: *django
    image: sukuna_local_flower
    container_name: sukuna_local_flower
    ports:
      - '5555:5555'
    command: uv run celery -A config.celery_app flower --port=5555
