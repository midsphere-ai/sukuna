services:
  docs:
    image: sukuna_local_docs
    container_name: sukuna_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.env.example
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./sukuna:/app/sukuna:z
    ports:
      - '9000:9000'
    command: /start-docs
