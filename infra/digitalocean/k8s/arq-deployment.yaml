apiVersion: apps/v1
kind: Deployment
metadata:
  name: arq-workers
  namespace: agent-platform
  labels:
    app: arq-workers
    environment: production
spec:
  replicas: 12
  selector:
    matchLabels:
      app: arq-workers
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: arq-workers
        environment: production
    spec:
      # Pull image from DigitalOcean Container Registry
      imagePullSecrets:
        - name: do-registry-credentials
      
      containers:
        - name: arq-worker
          image: registry.digitalocean.com/midsphere-production/platform-workers:latest
          imagePullPolicy: Always
          
          command:
            - arq
            - config.arq_worker.WorkerSettings
          
          resources:
            requests:
              memory: "400Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          # Environment variables from secrets
          envFrom:
            - secretRef:
                name: arq-secrets
                optional: true
          
          # Liveness probe
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f arq
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          
          # Readiness probe
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f arq
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      
      # Graceful shutdown
      terminationGracePeriodSeconds: 60
      
      # Node affinity for ARQ worker pool
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - arq-worker-pool
      
      # Tolerate taints if any
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "arq-workers"
          effect: "NoSchedule"
